// ─── calcFare（供 BookingSheet 使用）
function calcFare(origin, destX, destY, city) {
  const dx=Math.abs((destX||50)-50), dy=Math.abs((destY||50)-50);
  const estMin=Math.round(Math.sqrt(dx*dx+dy*dy)*0.9+5);
  const fare=Math.round((85+estMin*7)/10)*10;
  return { fareStr:`NT$${fare}～${fare+50}`, timeStr:`約 ${estMin} 分鐘` };
}

const CITIES = ["台中","台北","花蓮","台南","高雄"];
// ─── 活動類別偵測 ────────────────────────────────────────────────────────────
const CAT_KEYS = {
  音樂:["音樂","演唱","表演","音樂會","音樂節","live"],
  市集:["市集","夜市","集市","攤","逛街"],
  文化:["文化","博物館","展覽","藝術","導覽"],
  戶外:["戶外","步道","公園","自然","散步"],
  夜市:["夜市","宵夜"],
};
function detectCat(q){ for(const[cat,kws]of Object.entries(CAT_KEYS)){ if(kws.some(k=>q.includes(k))) return cat; } return null; }

function searchActs(city,cat){
  const pool=(ACTS[city]||ACTS[USER.city]||[]);
  let res=cat?pool.filter(a=>a.type===cat):pool;
  return res.sort((a,b)=>{
    let sa=0,sb=0;
    if(a.min<=USER.p75)sa+=2; if(b.min<=USER.p75)sb+=2;
    if(a.tod==="evening"&&USER.peakHour>=18)sa+=2; if(b.tod==="evening"&&USER.peakHour>=18)sb+=2;
    if(USER.interests.includes(a.type))sa+=1; if(USER.interests.includes(b.type))sb+=1;
    return sb-sa;
  }).slice(0,5);
}

function buildTripFromPending(pending,days){
  const city=pending[0]?.city||USER.city;
  const pool=(ACTS[city]||[]);
  const used=new Set(pending.map(a=>a.id));
  const extra=pool.filter(a=>!used.has(a.id)).sort((a,b)=>{
    let sa=0,sb=0;
    if(USER.interests.includes(a.type))sa+=2; if(USER.interests.includes(b.type))sb+=2;
    if(a.tod==="evening"&&USER.peakHour>=18)sa+=2; if(b.tod==="evening"&&USER.peakHour>=18)sb+=2;
    return sb-sa;
  });
  const total=days<=1?Math.max(pending.length,3):days===2?Math.max(pending.length,5):Math.max(pending.length,7);
  const all=[...pending,...extra].slice(0,total);
  const perDay=Math.ceil(all.length/days);
  return {
    name:`台中${days===1?"一日遊":days===2?"輕鬆兩天遊":"深度三天遊"}`,
    days:Array.from({length:days},(_,di)=>{
      const dayActs=all.slice(di*perDay,(di+1)*perDay).sort((a,b)=>a.startHour-b.startHour);
      return {
        di,date:getDayLabel(di),
        items:dayActs.map((a,i,arr)=>({
          spot:a.id,
          time:a.time.split("-")[0],
          fare:i<arr.length-1?mkFare(Math.abs((arr[i+1].min||10)-(a.min||10))+8):null,
        }))
      };
    })
  };
}


function detectCity(q){ return CITIES.find(c=>q.includes(c)); }

function processMsg(input,pending,hasTrip){
  const q=input.toLowerCase();
  // 0. 已有 pending，使用者要排行程 → ASK_DAYS
  if(/重新排|重排|更新行程/.test(q)&&(pending.length>0||hasTrip)) return {action:"ASK_DAYS",text:`好的！你目前共有 ${pending.length} 個活動，重新安排幾天？`};
  if(pending.length>0&&/排好|幫我排|確認行程|就這樣|開始排/.test(q)){
    return {action:"ASK_DAYS",text:`你選了 ${pending.length} 個活動，要安排幾天的行程？`};
  }
  // 1. 搜尋活動（有類別關鍵字）
  const cat=detectCat(q);
  const city=detectCity(q);
  // UX1: 只有城市名稱、沒有明確意圖 → 詢問要找什麼
  if(city&&!cat&&!/行程|遊|排|幫我|規劃|活動|有什麼|推薦|有沒有|今天|今晚/.test(q)){
    return {action:"GENERAL",text:`你想在${city}找什麼活動呢？\n\n🎵「${city}有什麼音樂活動？」\n🛍「${city}有什麼市集？」\n🎨「${city}有什麼文化活動？」\n\n或說「幫我排${city}一日遊」讓我直接幫你安排！`};
  }
  if(cat||/有什麼|推薦|有沒有|今天|今晚|今日/.test(q)){
    // 若沒有明確城市，反覆確認
    if(!city){
      return {action:"ASK_CITY",text:`你想找哪個城市的${cat||""}活動呢？

我有台中、台北、花蓮、台南、高雄的資料，告訴我你要去哪裡！`};
    }
    const results=searchActs(city,cat);
    if(results.length>0){
      const withinCount=results.filter(a=>a.min<=USER.p75).length;
      return {action:"SEARCH_ACTS",city,activities:results,
        text:`找到${city} ${results.length} 個${cat?cat:""}活動 🎯\n\n${USER.note}，你習慣 ${USER.p75} 分鐘內的車程，其中 ${withinCount} 個在你的舒適範圍內（標示 ✓）。\n\n點「＋加入行程」把喜歡的加進去，全選完再說「幫我排好」！`};
    }
  }
  // 2. 直接排行程（不先搜尋）
  if(/幫我排|幫我規劃|幫我安排/.test(q)||(/行程|遊/.test(q)&&/台中|台北|花蓮|台南|高雄/.test(q))){
    const days=/兩天|2天/.test(q)?2:/三天|3天/.test(q)?3:1;
    return {action:"TRIP",days,text:`好的！根據你的乘車習慣，幫你生成了${days===1?"一日遊":days===2?"兩天行程":"三天行程"} ✨\n\n✅ 全程 yoxi 接送\n✅ 已根據你 ${USER.p75} 分鐘舒適車程個人化排序\n\n行程已顯示在上方！你也可以先說「台中有什麼市集」找找想去的活動再加入。`};
  }
  // 3. 天數調整
  if(/兩天|2天/.test(q)&&/行程|遊/.test(q)) return {action:"DAYS",days:2,text:"好，幫你升級為兩天行程！第二天加入科博館、東海文青市集和草悟道音樂節 🗓"};
  if(/三天|3天/.test(q)&&/行程|遊/.test(q)) return {action:"DAYS",days:3,text:"三天深度遊來了！加入高美濕地夕陽、彩虹眷村和大慶夜市 🌟"};
  if(/一天|1天/.test(q)&&/行程|遊/.test(q)) return {action:"DAYS",days:1,text:"好，縮短為一日遊！精選最精華的景點 ✓"};
  // 4. 其他
  if(/替換|換掉|換成/.test(q)) return {action:"REPLACE",text:"已把第二站替換為「路易莎咖啡審計店」☕ 室內冷氣，長輩也很適合！行程時間同步更新。"};
  if(/分享|share|卡片|傳給/.test(q)) return {action:"SHARE",text:"幫你生成隊友分享卡！適合截圖傳到 LINE 群組 📱"};
  if(/謝謝|感謝/.test(q)) return {action:"GENERAL",text:"不客氣！祝你們旅途愉快 🎉 有需要隨時調整"};
  if(/你好|hi|hello/.test(q)) return {action:"GENERAL",text:`你好！我是 yoxi 智慧旅伴 AI 😊\n\n可以試試：\n・「台中今晚有什麼音樂活動？」\n・「推薦市集」\n・「幫我排台中一日遊」`};
  return {action:"GENERAL",text:`試試說：\n・「台中有什麼音樂活動？」→ AI 搜尋活動並讓你選\n・「幫我排台中一日遊」→ 直接生成行程\n・選好活動後說「幫我排好」→ 依你的選擇排程`};
}

              <div style={{fontSize:12,fontWeight:700,color:"#1e293b",marginTop:1}}>{spot.emoji} {spot.name}</div>
              <div style={{fontSize:9,color:"#94a3b8",marginTop:1}}>⏱ {spot.dur||"2小時"} ｜ 📍 {(spot.loc||"").slice(0,16)}...</div>
            </div>
            <button onClick={()=>onBook(spot)} style={{background:"#e63329",color:"#fff",border:"none",borderRadius:7,padding:"5px 9px",fontSize:9,fontWeight:700,cursor:"pointer",flexShrink:0,marginLeft:6}}>🚕 叫車</button>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:5}}>
            {tags.map(t=><span key={t} style={{background:TC[t]||"#f1f5f9",color:TT[t]||"#374151",fontSize:8,padding:"2px 6px",borderRadius:8}}>{t}</span>)}
          </div>
          {spot.tip&&<div style={{fontSize:9,color:"#f59e0b",marginTop:4,background:"#fffbeb",borderRadius:5,padding:"3px 7px"}}>{spot.tip}</div>}

        <div style={{paddingLeft:30}}>

      )}
    </div>
  );
}

function ItineraryCanvas({ tripTemplate, allSpots, selDay, onSelDay, onBook, onShare, onArrange, onComplete, onConfirmDays, onToggleEdit, onRemoveFromTrip, pendingActivities, onRemovePending, waitingForDays, editMode }) {
  const hasPending=(pendingActivities||[]).length>0;
  const hasTrip=!!tripTemplate;

  // 狀態：天數選擇（排好了之後）
  if(waitingForDays) return (
    <div style={{flex:"0 0 50%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#f8fafc",borderBottom:"1px solid #f1f5f9",gap:14,padding:"20px 24px"}}>
      <div style={{fontSize:28}}>📅</div>
      <div style={{fontSize:14,fontWeight:700,color:"#1e293b",textAlign:"center"}}>要安排幾天的行程？</div>
      <div style={{fontSize:11,color:"#94a3b8"}}>已選 {(pendingActivities||[]).length} 個活動</div>
      <div style={{display:"flex",flexDirection:"column",gap:9,width:"100%",maxWidth:240}}>
        {[{l:"一天衝完",v:1,d:"精選 3 個必去景點"},{l:"輕鬆兩天",v:2,d:"節奏悠閒，景點分散"},{l:"深度三天",v:3,d:"完整探索，不趕時間"}].map(b=>(
          <button key={b.v} onClick={()=>onConfirmDays(b.v)}
            style={{width:"100%",padding:"12px 16px",background:"#fff",border:"2px solid #e2e8f0",borderRadius:12,cursor:"pointer",textAlign:"left",transition:"all 0.15s"}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor="#e63329";e.currentTarget.style.background="#fff4f0";}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor="#e2e8f0";e.currentTarget.style.background="#fff";}}>
            <div style={{fontSize:13,fontWeight:700,color:"#1e293b"}}>{b.l}</div>
            <div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>{b.d}</div>
          </button>
        ))}
      </div>
    </div>
  );

  if(!hasTrip&&!hasPending) return (
    <div style={{flex:"0 0 38%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#f8fafc",borderBottom:"1px solid #f1f5f9",gap:10,padding:20}}>
      <div style={{fontSize:36}}>🗓️</div>
      <div style={{fontSize:13,color:"#94a3b8",textAlign:"center",lineHeight:1.8}}>行程將顯示在這裡<br/>在下方詢問活動開始規劃吧！</div>
      <div style={{background:"#fff",borderRadius:10,padding:"8px 14px",border:"1px solid #e2e8f0",fontSize:11,color:"#64748b",textAlign:"center",lineHeight:1.7}}>試試：「台中今晚有什麼市集？」<br/>或「幫我排台中一日遊」</div>
    </div>
  );

  if(!hasTrip&&hasPending) return (
    <div style={{flex:"0 0 52%",display:"flex",flexDirection:"column",overflow:"hidden",background:"#f8fafc",borderBottom:"1px solid #f1f5f9"}}>
      <div style={{background:"#fff",padding:"10px 14px",borderBottom:"1px solid #f1f5f9",flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontSize:12,fontWeight:700,color:"#1e293b"}}>📋 已選 {(pendingActivities||[]).length} 個活動</div>
          <div style={{fontSize:9,color:"#94a3b8",marginTop:1}}>選好後點下方按鈕安排行程</div>
        </div>
        <div style={{background:"#fff4f0",borderRadius:8,padding:"3px 9px",fontSize:9,color:"#e63329",fontWeight:600}}>選活動中</div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"8px 12px"}}>
        {(pendingActivities||[]).map((act,i)=>(
          <div key={act.id} style={{display:"flex",gap:9,alignItems:"center",padding:"8px 10px",background:"#fff",borderRadius:9,marginBottom:6,border:"1px solid #f1f5f9"}}>
            <div style={{width:20,height:20,borderRadius:"50%",background:TAG_COLOR[act.type]||"#e63329",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,flexShrink:0}}>{i+1}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:11,fontWeight:700,color:"#1e293b"}}>{act.emoji} {act.name}</div>
              <div style={{fontSize:9,color:"#94a3b8"}}>{act.time.split("-")[0]} · {act.min}分鐘</div>
            </div>
            <button onClick={()=>onRemovePending&&onRemovePending(act.id)} style={{background:"none",border:"none",color:"#cbd5e1",cursor:"pointer",fontSize:15,padding:"0 2px"}}>✕</button>
          </div>
        ))}
      </div>
      <div style={{padding:"10px 12px",background:"#fff",borderTop:"1px solid #f1f5f9",flexShrink:0}}>
        <button onClick={onArrange} style={{width:"100%",padding:"12px 0",background:"#16a34a",color:"#fff",border:"none",borderRadius:11,fontSize:13,fontWeight:700,cursor:"pointer"}}>
          ✨ 排好了，幫我安排行程
        </button>
      </div>
    </div>
  );

  const dayData=tripTemplate.days[selDay];
  const items=dayData.items.map(it=>({...it,spot:allSpots.find(s=>s.id===it.spot)})).filter(i=>i.spot);
  return (
    <div style={{display:"flex",flexDirection:"column",flex:"0 0 62%",overflow:"hidden",background:"#f8fafc",borderBottom:"1px solid #f1f5f9"}}>

      <div style={{background:"#fff",padding:"8px 12px",borderBottom:"1px solid #f1f5f9",flexShrink:0,display:"flex",gap:7}}>
        <button onClick={()=>{
          const first=tripTemplate.days[0]?.items?.[0];
          const spot=first&&allSpots.find(s=>s.id===first.spot);
          if(spot) onBook(spot);
        }} style={{flex:1,padding:"9px 0",background:"#e63329",color:"#fff",border:"none",borderRadius:9,fontSize:12,fontWeight:700,cursor:"pointer"}}>
          🚕 從第一站出發
        </button>
        <button onClick={onToggleEdit}
          style={{padding:"9px 12px",background:editMode?"#12182b":"#f8fafc",color:editMode?"#fff":"#64748b",border:`1px solid ${editMode?"#12182b":"#e2e8f0"}`,borderRadius:9,fontSize:11,cursor:"pointer",fontWeight:600,flexShrink:0}}>
          {editMode?"✓ 完成編輯":"✏️ 編輯"}
        </button>
        {!editMode&&<button onClick={onArrange}
          style={{padding:"9px 10px",background:"#f0fdf4",color:"#16a34a",border:"1px solid #bbf7d0",borderRadius:9,fontSize:10,cursor:"pointer",flexShrink:0,fontWeight:600}}>
          🔄 重排
        </button>}
        {!editMode&&<button onClick={onComplete}
          style={{padding:"9px 10px",background:"#f8fafc",color:"#64748b",border:"1px solid #e2e8f0",borderRadius:9,fontSize:10,cursor:"pointer",flexShrink:0,fontWeight:500}}>
          ✅ 完成旅行
        </button>}
        <button onClick={onShare}
          style={{padding:"9px 10px",background:"#f8fafc",color:"#e63329",border:"1px solid #fca5a5",borderRadius:9,fontSize:11,cursor:"pointer",flexShrink:0}}>
          📤
        </button>
      </div>
      {/* 天數 Tab */}
      <div style={{display:"flex",background:"#fff",borderBottom:"1px solid #f1f5f9",flexShrink:0}}>
        {tripTemplate.days.map((d,i)=>(
          <button key={i} onClick={()=>onSelDay(i)} style={{flex:1,padding:"8px 4px",background:"transparent",border:"none",borderBottom:selDay===i?"2.5px solid #e63329":"2.5px solid transparent",color:selDay===i?"#e63329":"#94a3b8",fontSize:10,fontWeight:selDay===i?700:400,cursor:"pointer"}}>
            <div>Day {i+1}</div><div style={{fontSize:8,opacity:0.7,marginTop:1}}>{d.date}</div>
          </button>
        ))}
      </div>
      <div style={{padding:"8px 10px 4px",flexShrink:0}}>
        <RouteMap items={dayData.items} allSpots={allSpots}/>
        <div style={{fontSize:9,color:"#94a3b8",textAlign:"center",marginTop:3}}>{tripTemplate.name} · {dayData.date}</div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"0 10px 10px"}}>
        {items.length===0&&<div style={{textAlign:"center",padding:"30px 20px",color:"#94a3b8",fontSize:12}}>此天行程已清空<br/><span style={{fontSize:10}}>點「🔄 重排」重新安排</span></div>}
        {items.map((it,i)=>(
          <div key={it.spot.id} style={{position:"relative"}}>
            {editMode&&(
              <button onClick={()=>onRemoveFromTrip(it.spot.id,selDay)}
                style={{position:"absolute",top:8,right:4,zIndex:10,width:22,height:22,background:"#fee2e2",border:"none",borderRadius:"50%",color:"#e63329",fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>
                ✕
              </button>
            )}
            <TimelineItem item={it} spot={it.spot}
              nextSpot={i<items.length-1?items[i+1].spot:null}
              nextFare={i<items.length-1?items[i+1].fare:null}
              isLast={i===items.length-1} index={i} onBook={editMode?null:onBook}/>
          </div>
        ))}
      </div>
    </div>
  );
}

function ShareLinkSection() {
  const [link, setLink] = useState(null);

  const genLink = () => {
    const code = Math.random().toString(36).slice(2,8).toUpperCase();
    setLink(`https://yoxi.app/trip/${code}`);

    if(link) { setCopied(true); setTimeout(()=>setCopied(false),2000); }

  return (
    <div style={{margin:"0 16px 12px",borderRadius:10,overflow:"hidden",border:"1px solid #e2e8f0"}}>
      {!link ? (
        <button onClick={genLink}
          style={{width:"100%",padding:"11px 0",background:"#fff",color:"#e63329",border:"none",fontSize:12,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>

function ChatMsg({ msg }) {
  const isUser=msg.role==="user";
  // simple bold: **text** → <strong>
  const renderText = (text) => {
    const parts = text.split(/(\*\*[^*]+\*\*)/g);
    return parts.map((p,i) => p.startsWith('**') ? <strong key={i}>{p.slice(2,-2)}</strong> : p);
  };
  return (
    <div style={{display:"flex",justifyContent:isUser?"flex-end":"flex-start",marginBottom:7,alignItems:"flex-end",gap:5}}>
      {!isUser&&<div style={{width:24,height:24,background:"#e63329",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#fff",fontWeight:700,flexShrink:0}}>AI</div>}
      <div style={{maxWidth:"80%",background:isUser?"#e63329":"#fff",color:isUser?"#fff":"#1e293b",padding:"8px 12px",borderRadius:isUser?"14px 14px 3px 14px":"3px 14px 14px 14px",fontSize:11,lineHeight:1.7,border:isUser?"none":"1px solid #f1f5f9",boxShadow:isUser?"none":"0 1px 3px rgba(0,0,0,0.05)",whiteSpace:"pre-line"}}>
        {renderText(msg.text)}
      </div>
    </div>
  );
}

function CarAnimation({ onComplete }) {
  const [phase, setPhase] = useState("entering");
  useEffect(() => {
    const t1 = setTimeout(() => setPhase("stopping"), 1100);
    const t2 = setTimeout(() => setPhase("exiting"), 1750);
    const t3 = setTimeout(() => onComplete(), 2050);
    return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); };
  }, [onComplete]);
  const carAnim = { entering:"carDriveIn 1.1s cubic-bezier(0.15,0.85,0.35,1) forwards", stopping:"carBounce 0.35s ease", exiting:"carDriveOut 0.35s ease-in forwards" }[phase];
  return (
    <div style={{ position:"fixed", inset:0, background:"#080e1c", zIndex:999, overflow:"hidden" }}>
      {STARS.map((s,i) => (<div key={i} style={{ position:"absolute", left:s.left, top:s.top, width:s.size, height:s.size, borderRadius:"50%", background:"#fff", opacity:s.opacity }} />))}
      <div style={{ position:"absolute", bottom:"26%", left:0, right:0, height:80, background:"#141e33", borderTop:"2.5px solid #1e3055", borderBottom:"2.5px solid #1e3055" }}>
        <div style={{ position:"absolute", top:"50%", left:0, right:0, transform:"translateY(-50%)", height:5, display:"flex", overflow:"hidden" }}>
          {[...Array(18)].map((_,i) => (<div key={i} style={{ width:72, height:5, background:"#f4b400", flexShrink:0, marginRight:68, borderRadius:3, opacity:0.6, animation:"dashMove 0.38s linear infinite", animationDelay:`${i*0.021}s` }} />))}
        </div>
      </div>
      <div style={{ position:"absolute", bottom:"26%", left:"50%", transform:"translateX(-50%)", animation:carAnim }}>
        <YoxiCar width={320} animating={phase==="entering"} />
        {phase==="entering" && [0,1,2,3].map(i => (<div key={i} style={{ position:"absolute", right:"100%", top:`${22+i*17}%`, width:`${38+i*20}px`, height:2.5, background:`rgba(244,180,0,${0.75-i*0.12})`, borderRadius:2, animation:"speedLines 0.14s ease infinite", animationDelay:`${i*0.025}s` }} />))}
      </div>
      <div style={{ position:"absolute", bottom:"10%", width:"100%", textAlign:"center", animation:"textFadeIn 0.5s ease 0.9s both", opacity:0 }}>
        <div style={{ fontSize:28, fontWeight:900, fontStyle:"italic", color:"#f4b400", fontFamily:"system-ui" }}>yoxi</div>
        <div style={{ fontSize:14, color:"rgba(255,255,255,0.65)", letterSpacing:2, marginTop:6 }}>快速抵達 · 城市探索夥伴</div>
      </div>
    </div>
  );
}

// ─── 主元件 App ──────────────────────────────────────────────────────────────
function App() {
  // 開場流程（保留自 App14）
  const [showCarAnim, setShowCarAnim] = useState(false);
  const animShown = useRef(false);
  const [isOpen, setIsOpen] = useState(false);

  // 行程看板
  const [tripDays, setTripDays] = useState(1);
  const [selDay, setSelDay] = useState(0);
  const [tripGenerated, setTripGenerated] = useState(false);
  const [pendingActivities, setPendingActivities] = useState([]);
  const [lastShownActivities, setLastShownActivities] = useState([]);
  const [customTrip, setCustomTrip] = useState(null);
  const [waitingForDays, setWaitingForDays] = useState(false);
  const [editMode, setEditMode] = useState(false);
  const allSpots = ACTS["台中"];
  const curTrip = customTrip || (tripGenerated ? TRIP_TEMPLATES[tripDays] : null);
  const addedIds = new Set(pendingActivities.map(a=>a.id));

  // AI 聊天
  const [msgs, setMsgs] = useState(INIT_MSGS);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const chatRef = useRef(null);
  const [showShare, setShowShare] = useState(false);
  const [showComplete, setShowComplete] = useState(false);

  // 叫車流程（保留自 App14）
  const [booking, setBooking] = useState(null);
  const [booked, setBooked] = useState(false);
  const [bookingOrigin, setBookingOrigin] = useState("");
  const [useGPS, setUseGPS] = useState(false);
  const [originError, setOriginError] = useState(false);

  // 響應式 panel 尺寸（保留自 App14）
  const [panelSize, setPanelSize] = useState(
    window.innerWidth < 600 ? "mobile" : window.innerWidth < 1024 ? "tablet" : "desktop"
  );
  useEffect(() => {
    const h = () => setPanelSize(window.innerWidth < 600 ? "mobile" : window.innerWidth < 1024 ? "tablet" : "desktop");
    window.addEventListener("resize", h);
    return () => window.removeEventListener("resize", h);
  }, []);

  // 自動捲動聊天
  useEffect(() => {
    if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  }, [msgs, typing]);

  // 切換天數時重設 selDay
  useEffect(() => { setSelDay(0); }, [tripDays]);



  // 發送訊息
  const sendMsg = (text) => {
    const t = text || input.trim();
    if (!t) return;
    setInput("");
    setMsgs(p => [...p, { id: Date.now(), role: "user", text: t }]);
    setTyping(true);
    setTimeout(() => {
      const result = processMsg(t, pendingActivities, tripGenerated||!!customTrip);
      if(result.action==="SEARCH_ACTS"){
        setLastShownActivities(result.activities||[]);
        setMsgs(p=>[...p,{id:Date.now()+1,role:"ai",text:result.text,activities:result.activities}]);
      } else if(result.action==="ASK_DAYS"){
        setWaitingForDays(true);
        setMsgs(p=>[...p,{id:Date.now()+1,role:"ai",text:result.text}]);
      } else {
        if(result.action==="ASK_CITY"){
          setMsgs(p=>[...p,{id:Date.now()+1,role:"ai",text:result.text}]);
          setTyping(false); return;
        }
        if(result.action==="TRIP"){
          const trip=buildTripFromPending(pendingActivities,result.days);
          setCustomTrip(trip); setTripDays(result.days); setTripGenerated(true); setSelDay(0);
          // 若 pending 為空，回填活動讓編輯/重排能正常運作
          if(pendingActivities.length===0){
            const filled=trip.days.flatMap(d=>d.items.map(it=>ACTS["台中"].find(s=>s.id===it.spot)).filter(Boolean));
            setPendingActivities(filled);
          }
        }
        if(result.action==="DAYS"){ const trip=buildTripFromPending(pendingActivities,result.days); setCustomTrip(trip); setTripDays(result.days); setTripGenerated(true); setSelDay(0); }
        if(result.action==="SHARE") setShowShare(true);
        setMsgs(p=>[...p,{id:Date.now()+1,role:"ai",text:result.text}]);
      }
      setTyping(false);
    }, 900);
  };

  // 叫車
  const handleConfirmDays = (days) => {
    const trip=buildTripFromPending(pendingActivities,days);
    setCustomTrip(trip); setTripGenerated(true); setSelDay(0); setWaitingForDays(false);
    setMsgs(p=>[...p,{id:Date.now(),role:"ai",text:`✨ ${days===1?"一日遊":days===2?"兩天行程":"三天行程"}安排好了！點各站的「🚕 叫車」出發，或點上方「編輯」調整行程。`}]);
  };

  const handleToggleEdit = () => {
    if(!editMode){
      if(!customTrip&&tripGenerated) setCustomTrip(JSON.parse(JSON.stringify(TRIP_TEMPLATES[tripDays])));
      setEditMode(true);
    } else { setEditMode(false); }
  };

  const handleRemoveFromTrip = (spotId,dayIdx) => {
    setCustomTrip(prev=>({...prev,days:prev.days.map((day,di)=>di===dayIdx?{...day,items:day.items.filter(it=>it.spot!==spotId)}:day)}));
    // 同步更新 pendingActivities（才能讓重新排時不包含已刪除項目）
    setPendingActivities(prev=>prev.filter(a=>a.id!==spotId));
  };

  const handleRemovePending = (id) => {
    setPendingActivities(prev=>prev.filter(a=>a.id!==id));
  };

  const handleAddActivity = (act) => {
    if(pendingActivities.find(a=>a.id===act.id)){
      setMsgs(p=>[...p,{id:Date.now(),role:"ai",text:`「${act.name}」已經在清單裡了！`}]);
      return;
    }
    const newPending=[...pendingActivities,act];
    setPendingActivities(newPending);
    // 若行程已生成，給個簡短提示（3.B：可繼續加）
    if(customTrip||tripGenerated){
      setMsgs(p=>[...p,{id:Date.now(),role:"ai",text:`已加入「${act.name}」！說「重新排行程」來更新上方行程。`}]);
    }
    // 若尚未生成，靜默（上方狀態 1 自動更新）
  };

    const handleCompleteTrip = () => {
    setShowComplete(true);
  };
  const resetAll = () => {
    setShowComplete(false);
    setPendingActivities([]);
    setCustomTrip(null);
    setTripGenerated(false);
    setTripDays(1);
    setSelDay(0);
    setWaitingForDays(false);
    setEditMode(false);
    setShowShare(false);
    setMsgs(INIT_MSGS);
    setInput("");
  };

  const handleBook = (spot) => {
    // 把 ACTS 的欄位名稱對應到 BookingSheet 需要的格式
    const bookingSpot = {
      ...spot,
      name: spot.name,
      address: spot.loc || spot.address || "",
      location: spot.loc || spot.location || "",
      mapX: spot.mx !== undefined ? spot.mx : (spot.mapX || 50),
      mapY: spot.my !== undefined ? spot.my : (spot.mapY || 50),
      tagColor: TAG_COLOR[spot.type] || "#e63329",
    };
    setBooking(bookingSpot); setBooked(false); setOriginError(false);
  };
  const handleConfirmBook = () => {
    if (!useGPS && !bookingOrigin.trim()) { setOriginError(true); return; }
    setBooked(true);
  };

  const panelStyle = {
    mobile: { position: "fixed", inset: 0, borderRadius: 0, width: "100%", height: "100%" },
    tablet: { position: "fixed", right: 0, top: 0, bottom: 0, width: 420, borderRadius: "16px 0 0 16px" },
    desktop: { position: "fixed", right: 28, bottom: 28, width: 440, height: "min(720px, calc(100vh - 56px))", borderRadius: 16 },
  }[panelSize];

  return (
    <>
      <style>{`
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;}
        @keyframes pulse{0%{transform:scale(1);opacity:0.9;}100%{transform:scale(1.65);opacity:0;}}
        @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
        @keyframes slideUp{from{transform:translateY(14px);opacity:0;}to{transform:translateY(0);opacity:1;}}
        @keyframes pulseG{0%,100%{opacity:1;}50%{opacity:0.4;}}
        @keyframes carDriveIn{0%{transform:translateX(110vw);}80%{transform:translateX(-10px);}90%{transform:translateX(4px);}100%{transform:translateX(0);}}
        @keyframes carBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
        @keyframes carDriveOut{0%{transform:translateX(0);}100%{transform:translateX(110vw);}}
        @keyframes dashMove{from{transform:translateX(0);}to{transform:translateX(-140px);}}
        @keyframes textFadeIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
        @keyframes wheelSpin{to{transform:rotate(360deg);}}
        @keyframes speedLines{0%{opacity:0.9;}100%{opacity:0;width:0;}}
        ::-webkit-scrollbar{width:4px;}
        ::-webkit-scrollbar-thumb{background:#e0e0e0;border-radius:4px;}
        button:focus,input:focus{outline:none;}
      `}</style>

      {/* 背景頁面（保留自 App14）*/}
      <div style={{ minHeight: "100vh", background: "#f0f4f8" }}>
        <nav style={{ background: "#fff", borderBottom: "1px solid #e8e8e8", padding: "0 32px", height: 56, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <div style={{ color: "#e63329", fontWeight: 900, fontSize: 22, fontStyle: "italic" }}>&#8627; yoxi</div>
          <div style={{ display: "flex", gap: 28, fontSize: 14, color: "#666" }}>
            {["立即叫車","車資試算","成為乘客","優惠快訊","客服中心"].map(t=><span key={t} style={{ cursor: "pointer" }}>{t}</span>)}
          </div>
        </nav>
        <div style={{ position: "relative", height: "calc(100vh - 56px)", overflow: "hidden" }}>
          <svg width="100%" height="100%" style={{ position: "absolute", inset: 0 }}>
            <rect width="100%" height="100%" fill="#e8f0fe" />
            <defs><pattern id="bg" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0L0 0 0 32" fill="none" stroke="#c7d8f8" strokeWidth="0.5"/></pattern></defs>
            <rect width="100%" height="100%" fill="url(#bg)" />
          </svg>
        </div>
      </div>

      {/* 開場動畫（保留自 App14）*/}
      {showCarAnim && <CarAnimation onComplete={() => { setShowCarAnim(false); setIsOpen(true); }} />}
      {!isOpen && !showCarAnim && (
        <FloatingBubble onClick={() => {
          if (animShown.current) { setIsOpen(true); }
          else { setShowCarAnim(true); animShown.current = true; }
        }} />
      )}

      {/* 面板 */}
      {isOpen && (
        <>
          {panelSize !== "desktop" && <div onClick={() => setIsOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.4)", zIndex: 99 }} />}
          <div style={{ ...panelStyle, zIndex: 100, background: "#fff", boxShadow: "0 10px 48px rgba(0,0,0,0.22)", display: "flex", flexDirection: "column", overflow: "hidden" }}>

            {/* Header（更新為新設計）*/}
            <div style={{ background: "linear-gradient(135deg,#12182b,#1e3050)", padding: "11px 14px", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ background: "#e63329", borderRadius: 7, padding: "3px 9px", fontSize: 13, fontWeight: 900, color: "#fff", letterSpacing: 1 }}>yoxi</div>
                <div>
                  <div style={{ color: "#fff", fontWeight: 700, fontSize: 13 }}>智慧旅伴 AI</div>
                  <div style={{ color: "rgba(255,255,255,0.45)", fontSize: 8 }}>已分析你的 {USER.totalRides.toLocaleString()} 次乘車記錄</div>
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <div style={{ background: "rgba(255,255,255,0.08)", borderRadius: 7, padding: "3px 8px", fontSize: 8, color: "rgba(255,255,255,0.55)" }}>台中 · 晚間出行</div>
                <button onClick={() => setIsOpen(false)} style={{ background: "none", border: "none", color: "rgba(255,255,255,0.7)", fontSize: 18, cursor: "pointer", padding: "0 2px" }}>✕</button>
              </div>
            </div>

            {showComplete && <TripCompleteOverlay onDone={resetAll} />}
            {/* 主體內容 */}
            {(
              <div style={{ display: "flex", flexDirection: "column", flex: 1, overflow: "hidden" }}>
                {/* 上半：行程看板 */}
                <ItineraryCanvas
                  tripTemplate={curTrip}
                  allSpots={allSpots}
                  selDay={selDay}
                  onSelDay={setSelDay}
                  onBook={handleBook}
                  onShare={() => setShowShare(true)}
                  pendingActivities={pendingActivities}
                  onRemovePending={handleRemovePending}
                  onArrange={() => sendMsg("排好了")}
                  onComplete={handleCompleteTrip}
                  onConfirmDays={handleConfirmDays}
                  onToggleEdit={handleToggleEdit}
                  onRemoveFromTrip={(spotId,dayIdx)=>handleRemoveFromTrip(spotId,dayIdx)}
                  waitingForDays={waitingForDays}
                  editMode={editMode} />
                {/* 下半：AI 聊天 */}
                <div style={{ display: "flex", flexDirection: "column", flex: 1, overflow: "hidden", background: "#fff" }}>
                  <div ref={chatRef} style={{ flex: 1, overflowY: "auto", padding: "10px 12px 4px" }}>
                    {msgs.map(m=>(
                  <div key={m.id}>
                    <ChatMsg msg={m}/>
                    {m.activities?.length>0&&(
                      <div style={{paddingLeft:28,paddingBottom:6}}>
                        <ActivityCarousel activities={m.activities} onAdd={handleAddActivity} onBook={handleBook} addedIds={addedIds}/>
                      </div>
                    )}
                    {m.pendingItems?.length>0&&(
                      <div style={{paddingLeft:28,paddingBottom:6}}>
                        <PendingList items={m.pendingItems} onArrange={()=>sendMsg("幫我排好行程")}/>
                      </div>
                    )}
                  </div>
                ))}
                    {typing && <TypingDot />}
                  </div>
                  <QuickActions onAction={sendMsg} onShare={() => setShowShare(true)} hasTrip={tripGenerated||!!customTrip} />
                  <div style={{ padding: "5px 10px 10px", display: "flex", gap: 7, background: "#fff", flexShrink: 0, borderTop: "0.5px solid #f1f5f9" }}>
                    <input value={input} onChange={e => setInput(e.target.value)}
                      onKeyDown={e => e.key === "Enter" && sendMsg()}
                      placeholder="告訴我你的需求，例如：改排兩天..."
                      style={{ flex: 1, padding: "8px 13px", borderRadius: 18, border: "1.5px solid #e2e8f0", fontSize: 11, background: "#f8fafc" }} />
                    <button onClick={() => sendMsg()} style={{ width: 34, height: 34, background: "#e63329", border: "none", borderRadius: "50%", cursor: "pointer", color: "#fff", fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>↑</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        </>
      )}


      {/* 叫車 Sheet */}
      {booking && (
        <BookingSheet activity={booking} booked={booked}
          origin={bookingOrigin} onOriginChange={setBookingOrigin}
          useGPS={useGPS} onToggleGPS={() => setUseGPS(g => !g)}
          originError={originError} onClearError={() => setOriginError(false)}
          onConfirm={handleConfirmBook}
          onCancel={() => { setBooking(null); setBooked(false); setOriginError(false); }}
          selectedCity="台中" />
      )}
      {showShare && curTrip && (
        <ShareModal tripName={curTrip.name} tripTemplate={curTrip} allSpots={allSpots} onClose={() => setShowShare(false)} />
      )}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
